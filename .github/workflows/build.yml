name: Build Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FQBN: esp32:esp32:esp32doit-devkit-v1
      SKETCH: ./propulsion-firmware
      LIBS: ./sensors,./comms,./interfaces
      BUILD_OUT: ./build

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: latest

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Ensure all sensors are enabled in config-ci.h
        run: |
          SENSOR_HEADERS=$(find sensors/src -maxdepth 1 -type f -name "*.h" -not -name "*Manager*" | sed -E 's#.*/(.*)\.h#\1#')
          MISSING=0

          echo "Checking sensors..."
          for SENSOR in $SENSOR_HEADERS; do
            DEFINE="USE_${SENSOR^^}"
            if ! grep -q "$DEFINE" propulsion-firmware/config-ci.h; then
              echo "Missing: $DEFINE in config-ci.h"
              MISSING=1
            else
              echo "Found: $DEFINE"
            fi
          done

          if [ $MISSING -ne 0 ]; then
            echo "::error ::Not all sensors are registered in config-ci.h"
            exit 1
          fi

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn $FQBN \
            $SKETCH \
            --libraries $LIBS \
            --output-dir $BUILD_OUT \
            --build-property build.extra_flags=-include=config-ci.h
