name: Build ESP32 Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with private submodules)
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}  # GH_TOKEN must be added as a repo secret

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: 0.34.0

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Apply CI sensor config (enables all sensors)
        run: cp propulsion-firmware/config-ci.h propulsion-firmware/config.h

      - name: Compile propulsion firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32doit-devkit-v1 \
            --libraries ./interfaces,./sensors,./comms \
            --build-property "build.extra_flags=-I./propulsion-firmware" \
            ./propulsion-firmware