name: Build ESP32 Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FQBN: "esp32:esp32:esp32doit-devkit-v1"
      SKETCH: "./propulsion-firmware"
      LIBS: "./sensors,./comms,./interfaces"
      BUILD_OUT: "./build"

    steps:
      # 1. Checkout with submodules
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}

      # 2. Install Arduino CLI
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/.arduino/bin" >> $GITHUB_PATH

      # 3. Install ESP32 core
      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      # 4. Run sensor config check
      - name: Check all sensors are registered in config-ci.h
        run: ./scripts/check-config-sensors.sh

      # 5. Compile firmware using CI config
      - name: Compile firmware
        run: |
          mkdir -p $BUILD_OUT
          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir "$BUILD_OUT" \
            --libraries "$LIBS" \
            --build-property "build.extra_flags=-DCI_BUILD -include=config-ci.h" \
            "$SKETCH"
